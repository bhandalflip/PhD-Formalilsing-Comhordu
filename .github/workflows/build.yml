name: build

on:
  # Once per PR update: when it's opened or reopened, and on each push to it.
  # No separate `push` trigger, which would build every PR commit twice.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.2.0
      # The image's opam switch belongs to the `rocq` user; run as root so the
      # checkout is writable, with the switch's binaries on PATH.
      options: --user root
    env:
      PATH: /home/rocq/.opam/4.14.2+flambda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Rocq version
        run: rocq --version
      - name: Build
        run: make -j"$(nproc)"
      - name: Report remaining assumptions under safety
        run: python3 helper-scripts/summarise_assumptions.py | tee -a "$GITHUB_STEP_SUMMARY"

  layout:
    runs-on: ubuntu-latest
    # The same image as the build, so that the checker's tests can compile their cases with Rocq.
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    env:
      PATH: /home/rocq/.opam/4.14.2+flambda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Test the proof layout checker
        run: python3 helper-scripts/test_check_proof_layout.py
      - name: Check the proof layout
        run: python3 helper-scripts/check_proof_layout.py
