name: lint

# Formatting only: no proof is checked here, which is the build's job.
on:
  # Once per PR update, as for the build.
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    # The build's image, so that the layout checker's tests can compile their cases with Rocq.
    container:
      image: rocq/rocq-prover:9.2.0
      options: --user root
    env:
      PATH: /home/rocq/.opam/4.14.2+flambda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Test the proof layout checker
        run: python3 helper-scripts/test_check_proof_layout.py
      - name: Check the proof layout
        run: python3 helper-scripts/check_proof_layout.py
